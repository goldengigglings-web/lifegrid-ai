<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>LIFEGRID AI</title>

        <style>
            * {
                  box-sizing: border-box;
                        margin: 0;
                              padding: 0;
                                    font-family: Arial, sans-serif;
                                        }

                                            body {
                                                  background: #f5f7fb;
                                                        color: #172033;
                                                            }

                                                                header {
                                                                      background: #172033;
                                                                            color: white;
                                                                                  padding: 28px 20px;
                                                                                        text-align: center;
                                                                                            }

                                                                                                header h1 {
                                                                                                      font-size: 30px;
                                                                                                            margin-bottom: 8px;
                                                                                                                }

                                                                                                                    header p {
                                                                                                                          font-size: 14px;
                                                                                                                                opacity: 0.8;
                                                                                                                                    }

                                                                                                                                        .container {
                                                                                                                                              max-width: 850px;
                                                                                                                                                    margin: auto;
                                                                                                                                                          padding: 20px;
                                                                                                                                                              }

                                                                                                                                                                  .card {
                                                                                                                                                                        background: white;
                                                                                                                                                                              border-radius: 18px;
                                                                                                                                                                                    padding: 20px;
                                                                                                                                                                                          margin-bottom: 18px;
                                                                                                                                                                                                box-shadow: 0 5px 20px rgba(0,0,0,0.07);
                                                                                                                                                                                                    }

                                                                                                                                                                                                        h2 {
                                                                                                                                                                                                              margin-bottom: 14px;
                                                                                                                                                                                                                    font-size: 20px;
                                                                                                                                                                                                                        }

                                                                                                                                                                                                                            textarea {
                                                                                                                                                                                                                                  width: 100%;
                                                                                                                                                                                                                                        min-height: 130px;
                                                                                                                                                                                                                                              border: 1px solid #d4d9e3;
                                                                                                                                                                                                                                                    border-radius: 12px;
                                                                                                                                                                                                                                                          padding: 14px;
                                                                                                                                                                                                                                                                font-size: 15px;
                                                                                                                                                                                                                                                                      outline: none;
                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                              input[type="file"] {
                                                                                                                                                                                                                                                                                    width: 100%;
                                                                                                                                                                                                                                                                                          padding: 12px;
                                                                                                                                                                                                                                                                                                border: 1px dashed #aeb6c5;
                                                                                                                                                                                                                                                                                                      border-radius: 12px;
                                                                                                                                                                                                                                                                                                            margin-top: 10px;
                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                    button {
                                                                                                                                                                                                                                                                                                                          width: 100%;
                                                                                                                                                                                                                                                                                                                                border: none;
                                                                                                                                                                                                                                                                                                                                      border-radius: 12px;
                                                                                                                                                                                                                                                                                                                                            padding: 15px;
                                                                                                                                                                                                                                                                                                                                                  margin-top: 15px;
                                                                                                                                                                                                                                                                                                                                                        background: #172033;
                                                                                                                                                                                                                                                                                                                                                              color: white;
                                                                                                                                                                                                                                                                                                                                                                    font-size: 16px;
                                                                                                                                                                                                                                                                                                                                                                          font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                  button:active {
                                                                                                                                                                                                                                                                                                                                                                                        transform: scale(0.98);
                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                .result {
                                                                                                                                                                                                                                                                                                                                                                                                      display: none;
                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                              .result-box {
                                                                                                                                                                                                                                                                                                                                                                                                                    background: #f5f7fb;
                                                                                                                                                                                                                                                                                                                                                                                                                          border-radius: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                padding: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                      margin-top: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                              .label {
                                                                                                                                                                                                                                                                                                                                                                                                                                                    font-size: 11px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                opacity: 0.6;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      text-transform: uppercase;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .value {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    margin-top: 5px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          font-size: 16px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .notice {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        font-size: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              opacity: 0.65;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    margin-top: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          line-height: 1.5;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <header>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <h1>⚡ LIFEGRID AI</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>Adaptive Crisis Intelligence System</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </header>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="container">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <h2>🔎 Analyze a Situation</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <textarea
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    id="situation"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          placeholder="Describe what is happening..."></textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    type="file"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          id="evidence"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                accept="image/*">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="startAnalysis()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          Analyze Evidence
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <p class="notice">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        LIFEGRID is a decision-support prototype. In a real emergency,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              contact the appropriate emergency service.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="card result" id="result">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <h2>🧠 LIFEGRID Analysis</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="result-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="label">Current Status</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="value" id="status">Waiting for AI analysis</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="result-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="label">Priority</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="value" id="priority">—</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="result-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="label">Recommended Next Action</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="value" id="action">—</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="result-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="label">Evidence Status</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="value" id="evidenceStatus">—</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function startAnalysis() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const situation =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("situation").value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const evidence =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("evidence").files.length;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (!situation && !evidence) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              alert("Please provide text or an image.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById("result").style.display = "block";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("status").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "Input received — AI engine will analyze the evidence.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("priority").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "Pending AI assessment";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("action").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "Awaiting AI-generated action plan.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("evidenceStatus").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              evidence
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ? "Image evidence attached"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          : "Text evidence provided";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </html>
